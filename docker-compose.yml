# 产品化拓扑: 传感器 (蜜罐+外送器) × N + hive (控制台+ingest) × 1
#
# 用法:
#   export HONEYPOT_CONSOLE_TOKEN=$(openssl rand -hex 16)
#   export ADMIN_PASSWORD=<强密码>          # hive 首次启动建管理员, 不设则默认 admin123 并告警
#   docker compose up -d
#   # 控制台: http://127.0.0.1:8899  (登录 admin / $ADMIN_PASSWORD)
#   # 多传感器: 改 SENSOR_ID 后再起第二个 compose 项目, 或去掉 ports 用外部反代

services:
  sensor:
    build:
      context: .
      args:
        INSTALL_DEEPTEAM: ${INSTALL_DEEPTEAM:-0}
    command: python main.py --server --port 8080
    environment:
      HONEYPOT_HIVE_URL: http://hive:8899
      HONEYPOT_HIVE_TOKEN: ${HONEYPOT_CONSOLE_TOKEN:?set HONEYPOT_CONSOLE_TOKEN}
      HONEYPOT_SENSOR_ID: ${SENSOR_ID:-sensor-1}
      HONEYPOT_SPOOL_DIR: /spool
      HONEYPOT_DB: ""            # 传感器本地不落库, 纯外送
    volumes:
      - spool:/spool
    ports:
      - "8080:8080"             # 仅 HTTP 蜜罐端口; 假 PG/Redis 为实验形态 (real_runner 内嵌) 不提供
    restart: unless-stopped

  hive:
    build:
      context: .
      args:
        INSTALL_DEEPTEAM: ${INSTALL_DEEPTEAM:-0}
    command: python experiments/dashboard.py --db /data/hive.sqlite --port 8899 --host 0.0.0.0
    environment:
      HONEYPOT_CONSOLE_TOKEN: ${HONEYPOT_CONSOLE_TOKEN:?set HONEYPOT_CONSOLE_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    volumes:
      - hive-data:/data
    ports:
      - "18899:8899"             # 避开宿主机已有 8899 服务; 容器内仍为 8899
    restart: unless-stopped

volumes:
  spool:
  hive-data:
